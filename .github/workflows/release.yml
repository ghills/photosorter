name: Release

# Every push to main (normally a merged PR) is tested, built for Windows and macOS,
# and published as a GitHub release. The newest one is always at
# https://github.com/ghills/photosorter/releases/latest
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # All dependencies are pure Go, so every target cross-compiles from one runner.
      # macOS is used so the Mac build can be merged into a universal binary with lipo.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          build() { GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="-s -w" -o "$3" .; }

          mkdir -p dist/stage
          build windows amd64 dist/stage/windows-amd64/photosorter.exe
          build windows arm64 dist/stage/windows-arm64/photosorter.exe
          build darwin  amd64 dist/stage/darwin-amd64
          build darwin  arm64 dist/stage/darwin-arm64

          mkdir -p dist/stage/macos-universal
          lipo -create -output dist/stage/macos-universal/photosorter \
            dist/stage/darwin-amd64 dist/stage/darwin-arm64
          codesign --force --sign - dist/stage/macos-universal/photosorter

          for d in windows-amd64 windows-arm64 macos-universal; do
            cp README.md photosorter.example.toml "dist/stage/$d/"
          done

          (cd dist/stage/windows-amd64 && zip -q ../../photosorter-windows-amd64.zip *)
          (cd dist/stage/windows-arm64 && zip -q ../../photosorter-windows-arm64.zip *)
          tar -C dist/stage/macos-universal -czf dist/photosorter-macos-universal.tar.gz .
          (cd dist && shasum -a 256 *.zip *.tar.gz > SHA256SUMS.txt)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: photosorter-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: photosorter-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          short=${GITHUB_SHA::7}
          cat > notes.md <<NOTES
          Automated build of ${GITHUB_SHA} from \`main\`.

          | Platform | Download |
          |---|---|
          | Windows (most PCs) | \`photosorter-windows-amd64.zip\` |
          | Windows on ARM | \`photosorter-windows-arm64.zip\` |
          | macOS (Intel and Apple silicon) | \`photosorter-macos-universal.tar.gz\` |

          See the README's "Download" section for first-run steps.
          NOTES
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }} ($short)" \
            --notes-file notes.md \
            --latest
